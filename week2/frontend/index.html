<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Action Item Extractor</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; margin: 2rem auto; max-width: 800px; padding: 0 1rem; }
      h1 { font-size: 1.5rem; }
      textarea { width: 100%; min-height: 160px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace; }
      button { padding: 0.5rem 1rem; cursor: pointer; }
      button.primary { background-color: #3b82f6; color: white; border: none; border-radius: 4px; }
      button.secondary { background-color: #10b981; color: white; border: none; border-radius: 4px; }
      button.info { background-color: #6366f1; color: white; border: none; border-radius: 4px; }
      .items { margin-top: 1rem; }
      .item { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0; }
      .muted { color: #6b7280; font-size: 0.875rem; }
      .row { display: flex; gap: 0.5rem; align-items: center; }
      .notes-section { margin-top: 2rem; border-top: 1px solid #e5e7eb; padding-top: 1rem; }
      .note-item { padding: 0.75rem; margin: 0.5rem 0; background: #f9fafb; border-radius: 4px; }
      .note-content { margin-top: 0.25rem; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Action Item Extractor</h1>
    <p class="muted">Paste notes and extract actionable items. Minimal raw HTML frontend.</p>

    <label for="text">Notes</label>
    <textarea id="text" placeholder="Paste notes here...&#10;e.g.&#10;- [ ] Set up database&#10;- Implement extract endpoint"></textarea>
    <div class="row">
      <label class="row"><input id="save_note" type="checkbox" checked /> Save as note</label>
      <button id="extract" class="primary">Extract (Heuristic)</button>
      <button id="extract-llm" class="secondary">Extract LLM</button>
    </div>

    <div class="items" id="items"></div>

    <div class="notes-section">
      <h2>Saved Notes</h2>
      <button id="list-notes" class="info">List Notes</button>
      <div id="notes-list"></div>
    </div>

    <script>
      const $ = (sel) => document.querySelector(sel);
      const itemsEl = $('#items');
      const notesListEl = $('#notes-list');
      
      // Helper function to extract action items
      async function extractItems(endpoint, buttonLabel) {
        const text = $('#text').value;
        const save = $('#save_note').checked;
        itemsEl.textContent = `${buttonLabel}...`;
        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, save_note: save }),
          });
          if (!res.ok) throw new Error('Request failed');
          const data = await res.json();
          if (!data.items || data.items.length === 0) {
            itemsEl.innerHTML = '<p class="muted">No action items found.</p>';
            return;
          }
          itemsEl.innerHTML = data.items.map(it => (
            `<div class="item"><input type="checkbox" data-id="${it.id}" /> <span>${it.text}</span></div>`
          )).join('');
          itemsEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', async (e) => {
              const id = e.target.getAttribute('data-id');
              await fetch(`/action-items/${id}/done`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ done: e.target.checked }),
              });
            });
          });
        } catch (err) {
          console.error(err);
          itemsEl.textContent = 'Error extracting items';
        }
      }
      
      // Heuristic extraction button
      $('#extract').addEventListener('click', () => {
        extractItems('/action-items/extract', 'Extracting (Heuristic)');
      });
      
      // LLM extraction button
      $('#extract-llm').addEventListener('click', () => {
        extractItems('/action-items/extract-llm', 'Extracting (LLM)');
      });
      
      // List notes button
      $('#list-notes').addEventListener('click', async () => {
        notesListEl.textContent = 'Loading notes...';
        try {
          const res = await fetch('/notes', {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' },
          });
          if (!res.ok) throw new Error('Request failed');
          const notes = await res.json();
          
          if (!notes || notes.length === 0) {
            notesListEl.innerHTML = '<p class="muted">No notes found.</p>';
            return;
          }
          
          notesListEl.innerHTML = notes.map(note => (
            `<div class="note-item">
              <div class="muted">ID: ${note.id} | Created: ${note.created_at}</div>
              <div class="note-content">${note.content}</div>
            </div>`
          )).join('');
        } catch (err) {
          console.error(err);
          notesListEl.textContent = 'Error loading notes';
        }
      });

    </script>
  </body>
  </html>
